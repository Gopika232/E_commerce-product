<div class="toolbar-row">
    <mat-form-field appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput (input)="applyFilter($event)" placeholder="Search
products" />
    </mat-form-field>
    <span class="spacer"></span>
    <button mat-flat-button color="primary" (click)="openAdd()"><mat-icon>add</mat-icon> Add Product</button>
</div>
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let el">{{el.id}}</td>
    </ng-container>
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let el">{{el.name}}</td>
    </ng-container>
    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let el">{{el.category}}</td>
    </ng-container>
    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
        <td mat-cell *matCellDef="let el">₹{{el.price}}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
        <td mat-cell *matCellDef="let el">{{el.stock}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let el">
            <button mat-icon-button (click)="edit(el)">
                <mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="delete(el)">
                <mat-icon>delete</mat-icon></button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5,10,25]" showFirstLastButtons></mat-paginator>
